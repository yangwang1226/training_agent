<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试场景配置API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #4318FF;
            padding-bottom: 1rem;
        }
        .input-group {
            margin: 1rem 0;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #555;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background: #4318FF;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background: #3614cc;
        }
        .result {
            margin-top: 2rem;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 4px;
            border-left: 4px solid #4318FF;
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error {
            background: #fee;
            border-left-color: #f44;
            color: #c33;
        }
        .success {
            background: #efe;
            border-left-color: #4a4;
            color: #2a2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 测试场景配置API</h1>
        
        <div class="input-group">
            <label for="sceneCode">场景代码（scene_code）:</label>
            <input type="text" id="sceneCode" placeholder="例如: auto_first_visit" value="auto_first_visit">
        </div>
        
        <button onclick="testAPI()">🚀 测试API</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testAPI() {
            const sceneCode = document.getElementById('sceneCode').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!sceneCode) {
                resultDiv.innerHTML = '<div class="result error"><strong>❌ 错误</strong><p>请输入场景代码</p></div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="result"><strong>⏳ 加载中...</strong></div>';
            
            try {
                console.log('请求URL:', `/api/preset-scene/config/${sceneCode}`);
                
                const response = await fetch(`/api/preset-scene/config/${sceneCode}`);
                const result = await response.json();
                
                console.log('API响应:', result);
                
                if (result.success) {
                    const data = result.data;
                    
                    // 检查数据结构
                    const checks = {
                        'scene_code': data.scene_code ? '✅' : '❌',
                        'scene_name': data.scene_name ? '✅' : '❌',
                        'scene_description': data.scene_description ? '✅' : '❌',
                        'ai_role': data.ai_role ? '✅' : '❌',
                        'user_role': data.user_role ? '✅' : '❌',
                        'difficulty': data.difficulty ? '✅' : '❌',
                        'opening_line': data.opening_line ? '✅' : '❌ (可能为空)',
                        'fixed_questions (数组)': Array.isArray(data.fixed_questions) ? `✅ (${data.fixed_questions.length}项)` : '❌ 不是数组',
                        'related_questions (数组)': Array.isArray(data.related_questions) ? `✅ (${data.related_questions.length}项)` : '❌ 不是数组',
                        'sop_checklist (数组)': Array.isArray(data.sop_checklist) ? `✅ (${data.sop_checklist.length}项)` : '❌ 不是数组'
                    };
                    
                    let html = '<div class="result success">';
                    html += '<strong>✅ 成功</strong>';
                    html += '<h3>数据结构检查:</h3>';
                    html += '<ul>';
                    for (const [key, value] of Object.entries(checks)) {
                        html += `<li><strong>${key}</strong>: ${value}</li>`;
                    }
                    html += '</ul>';
                    html += '<h3>完整响应数据:</h3>';
                    html += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                    html += '</div>';
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ API返回错误</strong>
                            <p>${result.error || '未知错误'}</p>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('请求失败:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ 请求失败</strong>
                        <p>${error.message}</p>
                        <p>请检查：</p>
                        <ul>
                            <li>后端服务是否正在运行</li>
                            <li>场景代码是否正确</li>
                            <li>API路由是否正确配置</li>
                        </ul>
                    </div>
                `;
            }
        }
        
        // 页面加载时自动测试
        window.addEventListener('DOMContentLoaded', function() {
            console.log('测试页面已加载');
        });
    </script>
</body>
</html>
