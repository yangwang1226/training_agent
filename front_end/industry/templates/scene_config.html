<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景配置 - AI销售教练</title>
    <link rel="stylesheet" href="/industry/static/css/scene_config.css">
</head>
<body>
    <div class="config-page">
        <!-- 顶部导航栏 -->
        <header class="config-header">
            <div class="header-left">
                <button class="btn-back" onclick="history.back()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    返回场景选择
                </button>
                <h1 class="page-title" id="pageTitle">场景配置</h1>
            </div>
            <div class="header-right">
                <button class="btn-start-training" id="btnStartTraining">
                    开始训练
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="config-main">
            <div class="config-container">
                
                <!-- 场景信息 -->
                <section class="config-section">
                    <div class="section-header">
                        <h2>📋 场景信息</h2>
                    </div>
                    <div class="scene-info-card">
                        <div class="scene-icon" id="sceneIcon">🚗</div>
                        <div class="scene-details">
                            <h3 class="scene-name" id="sceneName">客户首次进店接待</h3>
                            <p class="scene-desc" id="sceneDesc">模拟客户首次进入4S店的接待场景</p>
                            <div class="scene-meta">
                                <span class="meta-item">
                                    <strong>AI扮演：</strong>
                                    <span id="aiRole">意向购车客户</span>
                                </span>
                                <span class="meta-item">
                                    <strong>你扮演：</strong>
                                    <span id="userRole">汽车销售顾问</span>
                                </span>
                                <span class="meta-item">
                                    <strong>难度：</strong>
                                    <span id="difficulty">中等</span>
                                </span>
                                <span class="meta-item">
                                    <strong>时长：</strong>
                                    <span id="duration">约10分钟</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 场景背景 -->
                <section class="config-section">
                    <div class="section-header">
                        <h2>📝 场景背景 <span class="required">*</span></h2>
                    </div>
                    <div class="section-content">
                        <textarea id="backgroundInput" 
                            class="config-textarea"
                            placeholder="例如：客户是30岁女性，预算20万左右，关注安全性和外观，周末带家人来看车"
                            maxlength="200"
                            rows="3"></textarea>
                        <div class="char-counter">
                            <span id="charCount">0</span>/200
                        </div>
                        <p class="hint">💡 一句话描述客户特征，AI会据此生成更真实的对话</p>
                        
                        <!-- 快捷标签 -->
                        <div class="quick-tags" id="quickTags">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                </section>

                <!-- AI开场白 -->
                <section class="config-section">
                    <div class="section-header">
                        <h2>🎤 AI开场白 <span class="required">*</span></h2>
                        <button class="btn-restore" id="btnRestoreOpening">恢复默认</button>
                    </div>
                    <div class="section-content">
                        <input type="text" 
                            id="openingInput" 
                            class="config-input"
                            placeholder="对练开始后，AI（模拟客户）说的第一句话"
                            maxlength="500">
                        <p class="hint">💡 对练开始后，AI（模拟客户）说的第一句话</p>
                    </div>
                </section>

                <!-- 固定问题 -->
                <section class="config-section collapsible">
                    <div class="section-header clickable" data-target="fixedQuestionsContent">
                        <div class="header-left">
                            <h2>💬 固定问题（AI必问）</h2>
                            <span class="count-badge" id="fixedQuestionCount">共0个问题</span>
                        </div>
                        <div class="header-right">
                            <button class="btn-restore" id="btnRestoreFixed" onclick="event.stopPropagation()">恢复默认</button>
                            <button class="btn-toggle">
                                <svg class="icon-toggle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="section-content collapsed" id="fixedQuestionsContent">
                        <div class="question-list" id="fixedQuestionList">
                            <!-- 动态生成 -->
                        </div>
                        <button class="btn-add" id="btnAddFixed">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            添加问题
                        </button>
                    </div>
                </section>

                <!-- 关联问题 -->
                <section class="config-section collapsible">
                    <div class="section-header clickable" data-target="relatedQuestionsContent">
                        <div class="header-left">
                            <h2>🔀 关联问题（情境触发）</h2>
                            <span class="count-badge" id="relatedQuestionCount">共0个问题</span>
                        </div>
                        <div class="header-right">
                            <button class="btn-restore" id="btnRestoreRelated" onclick="event.stopPropagation()">恢复默认</button>
                            <button class="btn-toggle">
                                <svg class="icon-toggle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="section-content collapsed" id="relatedQuestionsContent">
                        <div class="related-question-list" id="relatedQuestionList">
                            <!-- 动态生成 -->
                        </div>
                        <button class="btn-add" id="btnAddRelated">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            添加关联问题
                        </button>
                    </div>
                </section>

                <!-- SOP质检项 -->
                <section class="config-section collapsible">
                    <div class="section-header clickable" data-target="sopChecklistContent">
                        <div class="header-left">
                            <h2>✅ SOP质检项</h2>
                            <span class="count-badge" id="sopChecklistCount">共0个质检项</span>
                        </div>
                        <div class="header-right">
                            <button class="btn-restore" id="btnRestoreSop" onclick="event.stopPropagation()">恢复默认</button>
                            <button class="btn-toggle">
                                <svg class="icon-toggle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="section-content collapsed" id="sopChecklistContent">
                        <div class="sop-list" id="sopList">
                            <!-- 动态生成 -->
                        </div>
                        <button class="btn-add" id="btnAddSop">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            添加质检项
                        </button>
                    </div>
                </section>

                <!-- 底部操作按钮 -->
                <section class="config-actions">
                    <button class="btn-cancel" onclick="history.back()">取消</button>
                    <button class="btn-submit" id="btnSubmit">
                        开始训练
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </section>

            </div>
        </main>
    </div>

    <script src="/industry/static/js/scene_config.js"></script>
</body>
</html>
