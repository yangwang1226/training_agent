<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能教练 - 选择你的行业</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/industry/static/css/industry.css">
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="/industry/" class="navbar-brand">
            <div class="navbar-logo">🎓</div>
            <span class="navbar-title">AI智能教练</span>
        </a>
        <div class="navbar-actions">
            <button class="btn-login" id="loginBtn">登录</button>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="page-container">

        <!-- 英雄区域 -->
        <section class="hero-section">
            <h1 class="hero-title">
                一分钟开始，让每个用户都拥有自己的专属AI教练
            </h1>
            <div class="hero-subtitle-box">
                <p class="hero-subtitle">选择你的行业，立即开始训练</p>
            </div>
        </section>

        <!-- 行业卡片网格 -->
        <section class="industry-section">
            <div class="industry-grid" id="industryGrid">
                <!-- 卡片由 JS 动态渲染 -->
            </div>
        </section>

        <!-- 使用步骤 -->
        <section class="steps-section">
            <div class="steps-header">
                <span class="steps-header-icon">💡</span>
                <span class="steps-header-text">如何使用？</span>
            </div>
            <div class="steps-flow">
                <div class="step-item">
                    <div class="step-number">1</div>
                    <div class="step-text">选择行业</div>
                </div>
                <span class="step-arrow">→</span>
                <div class="step-item">
                    <div class="step-number">2</div>
                    <div class="step-text">选择场景</div>
                </div>
                <span class="step-arrow">→</span>
                <div class="step-item">
                    <div class="step-number">3</div>
                    <div class="step-text">一句话调整</div>
                </div>
                <span class="step-arrow">→</span>
                <div class="step-item">
                    <div class="step-number">4</div>
                    <div class="step-text">开始训练</div>
                </div>
            </div>
        </section>

    </div>

    <!-- 场景选择模态框 -->
    <div class="scene-modal-overlay" id="sceneModalOverlay">
        <div class="scene-modal">
            <div class="scene-modal-header">
                <h2>
                    <span id="modalIndustryIcon"></span>
                    <span id="modalIndustryName"></span> - 选择训练场景
                </h2>
                <button class="scene-modal-close" id="sceneModalClose">&times;</button>
            </div>
            <div class="scene-modal-body">
                <div class="scene-list" id="sceneList">
                    <!-- 场景列表由 JS 动态渲染 -->
                </div>
            </div>
        </div>
    </div>

        <!-- 背景补充模态框 -->
    <div class="bg-modal-overlay" id="bgModalOverlay">
        <div class="bg-modal">
            <!-- 顶部进度指示 -->
            <div class="bg-modal-progress">
                <div class="progress-step completed">
                    <div class="progress-dot">✓</div>
                    <span>选择行业</span>
                </div>
                <div class="progress-line completed"></div>
                <div class="progress-step completed">
                    <div class="progress-dot">✓</div>
                    <span>选择场景</span>
                </div>
                <div class="progress-line active"></div>
                <div class="progress-step active">
                    <div class="progress-dot">3</div>
                    <span>补充背景</span>
                </div>
                <div class="progress-line"></div>
                <div class="progress-step">
                    <div class="progress-dot">4</div>
                    <span>开始训练</span>
                </div>
            </div>

            <!-- 关闭按钮 -->
            <button class="bg-modal-close" id="bgModalClose">&times;</button>

            <!-- 场景信息卡片 -->
            <div class="bg-scene-card">
                <div class="bg-scene-icon" id="bgSceneIcon"></div>
                <div class="bg-scene-info">
                    <div class="bg-scene-name" id="bgSceneName">客户首次到店接待</div>
                    <div class="bg-scene-desc" id="bgSceneDesc">模拟客户首次进入4S店的接待场景</div>
                </div>
            </div>

            <!-- 角色分配 -->
            <div class="bg-role-section">
                <div class="bg-role-item">
                    <div class="bg-role-badge ai">AI扮演</div>
                    <div class="bg-role-name" id="bgAiRole">想看车的客户</div>
                </div>
                <div class="bg-role-vs">VS</div>
                <div class="bg-role-item">
                    <div class="bg-role-badge user">你扮演</div>
                    <div class="bg-role-name" id="bgUserRole">汽车销售顾问</div>
                </div>
            </div>

            <!-- 一句话背景输入 -->
            <div class="bg-input-section">
                <label class="bg-input-label">
                    <span class="bg-input-label-icon">✏️</span>
                    补充一句话场景背景 <span class="bg-input-optional">(可选)</span>
                </label>
                <div class="bg-input-wrapper">
                    <textarea id="bgBackgroundInput" 
                        placeholder="例如：客户是30岁女性，预算20万左右，关注安全性和外观，周末带家人来看车"
                        maxlength="200"
                        rows="3"></textarea>
                    <div class="bg-input-counter"><span id="bgCharCount">0</span>/200</div>
                </div>
                <!-- 快捷示例标签 -->
                <div class="bg-quick-tags" id="bgQuickTags">
                    <!-- 由 JS 动态渲染 -->
                </div>
            </div>

                        <!-- 底部操作按钮 -->
            <div class="bg-modal-actions">
                <button class="bg-btn-start" id="bgBtnStart">
                    开始训练
                    <span class="bg-btn-arrow">→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="/industry/static/js/industry.js"></script>
</body>
</html>
