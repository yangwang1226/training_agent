<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能训练系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>AI智能训练系统</h1>
            <p class="subtitle">对话模式 - 像和朋友聊天一样告诉我您的需求</p>
        </header>

        <div class="main-content">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <input type="text" id="userInput" placeholder="输入您的消息..." autocomplete="off">
                        <button id="sendBtn" class="btn btn-primary">发送</button>
                    </div>
                    <div class="action-buttons" id="actionButtons" style="display: none;">
                        <button id="generateBtn" class="btn btn-success">生成提示词</button>
                        <button id="resetBtn" class="btn btn-warning">重新开始</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="result-modal" id="resultModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>生成的提示词</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <div class="modal-body">
                    <pre id="promptResult"></pre>
                </div>
                <div class="modal-footer">
                    <div class="save-section">
                        <input type="text" id="promptName" placeholder="请输入场景名称..." class="prompt-name-input">
                        <button class="btn btn-success" id="saveBtn">保存场景</button>
                    </div>
                    <div class="action-row">
                        <button class="btn btn-primary" id="copyBtn">复制到剪贴板</button>
                        <button class="btn btn-realtime" id="startRealtimeBtn" style="display: none;">开始对话</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="toast" id="toast"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
