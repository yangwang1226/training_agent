<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI教练 - 训练评估</title>
    <link rel="stylesheet" href="/evaluate/static/css/evaluate.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>AI Coach</h1>
                <p class="subtitle">智能销售陪练系统</p>
            </div>
            
            <nav class="nav-links">
                <button class="tab-btn active" data-tab="profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    能力画像
                </button>
                <button class="tab-btn" data-tab="history">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    训练历史
                </button>
                <button class="tab-btn" data-tab="assessment">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    评估报告
                </button>
                <button class="tab-btn" data-tab="suggestions">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    改进建议
                </button>
            </nav>

            <div class="sidebar-footer">
                <a href="/realtime" class="action-btn primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    开始训练
                </a>
                <a href="/" class="action-btn secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    返回首页
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h2 id="pageTitle">能力画像</h2>
                    <p>查看您的销售能力成长轨迹</p>
                </div>
                <div class="user-profile">
                    <div class="user-avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <span>User</span>
                </div>
            </header>

            <!-- Profile Tab -->
            <section id="profile-tab" class="tab-content active">
                <div class="dashboard-grid">
                    <!-- Stats Cards -->
                    <div class="card stat-card">
                        <div class="stat-icon blue">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <h4>训练次数</h4>
                            <span class="value" id="trainingCount">0</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon green">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                                <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                                <line x1="12" y1="20" x2="12.01" y2="20"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <h4>训练时长(分)</h4>
                            <span class="value" id="totalDuration">0</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon orange">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                                <polyline points="17 6 23 6 23 12"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <h4>最高得分</h4>
                            <span class="value">--</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon blue">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 20V10"/>
                                <path d="M12 20V4"/>
                                <path d="M6 20v-6"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <h4>能力等级</h4>
                            <span class="value" id="levelText">--</span>
                        </div>
                    </div>

                    <!-- Level & Score Section -->
                    <div class="card level-section">
                        <div class="level-badge-large" id="levelBadge">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                <path d="M2 17l10 5 10-5"/>
                                <path d="M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <span class="level-label" id="levelLabelText">入门</span>
                        <div class="score-display">
                            <svg viewBox="0 0 200 200">
                                <circle class="score-bg" cx="100" cy="100" r="90"/>
                                <circle class="score-progress" cx="100" cy="100" r="90" id="scoreCircle"/>
                            </svg>
                            <div class="score-center">
                                <span class="number" id="overallScore">0</span>
                                <span class="label">综合得分</span>
                            </div>
                        </div>
                    </div>

                    <!-- Radar Chart Section -->
                    <div class="card chart-section">
                        <h3>能力维度分析</h3>
                        <div style="height: 300px; display: flex; justify-content: center;">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>

                    <!-- Strengths & Weaknesses -->
                    <div class="analysis-grid">
                        <div class="card analysis-card">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                                优势领域
                            </h3>
                            <div class="list-container" id="strengthsList">
                            </div>
                        </div>
                        <div class="card analysis-card">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                                    <polyline points="17 6 23 6 23 12"/>
                                </svg>
                                待提升领域
                            </h3>
                            <div class="list-container" id="weaknessesList">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- History Tab -->
            <section id="history-tab" class="tab-content">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3>训练记录</h3>
                        <select id="industryFilter" style="padding: 8px; border-radius: 8px; border: 1px solid #E0E5F2;">
                            <option value="">全部行业</option>
                            <option value="教育">教育</option>
                            <option value="汽车">汽车</option>
                            <option value="房地产">房地产</option>
                            <option value="金融">金融</option>
                        </select>
                    </div>
                    
                    <div class="history-table-container">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>行业/角色</th>
                                    <th>时间</th>
                                    <th>时长</th>
                                    <th>得分</th>
                                    <th>状态</th>
                                </tr>
                            </thead>
                            <tbody id="historyList">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <h3>成绩趋势</h3>
                    <div style="height: 300px;">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Assessment Tab -->
            <section id="assessment-tab" class="tab-content">
                <div class="card" style="margin-bottom: 20px;">
                    <label for="sessionSelect" style="font-weight: bold; margin-right: 10px;">选择训练记录：</label>
                    <select id="sessionSelect" style="padding: 10px; border-radius: 8px; border: 1px solid #E0E5F2; min-width: 300px;">
                        <option value="">请选择...</option>
                    </select>
                </div>

                <div id="assessmentReport" style="display: none;">
                    <div class="report-header-card">
                        <div class="report-title">
                            <h1 id="reportTitle">评估报告</h1>
                            <span class="report-meta" id="reportDate"></span>
                            <div class="report-meta" id="reportDuration"></div>
                        </div>
                        <div class="report-score-box">
                            <span class="score" id="reportScore">0</span>
                            <span class="label">本次得分</span>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="card" style="grid-column: span 6;">
                            <h3>维度得分</h3>
                            <div id="reportDimensions"></div>
                        </div>

                        <div class="card" style="grid-column: span 6;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                </svg>
                                对话金句
                            </h3>
                            <div id="reportGolden"></div>
                        </div>

                        <div class="card" style="grid-column: span 6;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                                亮点表现
                            </h3>
                            <ul id="reportHighlights" style="padding-left: 20px; color: var(--text-secondary);"></ul>
                        </div>

                        <div class="card" style="grid-column: span 6;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                                    <polyline points="17 6 23 6 23 12"/>
                                </svg>
                                改进建议
                            </h3>
                            <ul id="reportImprovements" style="padding-left: 20px; color: var(--text-secondary);"></ul>
                        </div>

                        <div class="card" style="grid-column: span 12;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="8" x2="12" y2="12"/>
                                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                                </svg>
                                关键节点回顾
                            </h3>
                            <div id="reportMoments"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Suggestions Tab -->
            <section id="suggestions-tab" class="tab-content">
                <div class="card" style="text-align: center; padding: 40px;">
                    <button class="action-btn primary" id="generateSuggestions" style="max-width: 300px; margin: 0 auto;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        生成个性化学习建议
                    </button>
                </div>

                <div id="suggestionsContent" style="display: none; margin-top: 20px;">
                    <div class="dashboard-grid">
                        <div class="card" style="grid-column: span 12;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <circle cx="12" cy="12" r="6"/>
                                    <circle cx="12" cy="12" r="2"/>
                                </svg>
                                重点提升领域
                            </h3>
                            <p id="priorityArea" style="color: var(--text-secondary); font-size: 16px;"></p>
                        </div>

                        <div class="card" style="grid-column: span 8;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                                </svg>
                                学习路径
                            </h3>
                            <div id="learningPath"></div>
                        </div>

                        <div class="card" style="grid-column: span 4;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <line x1="3" y1="9" x2="21" y2="9"/>
                                    <line x1="9" y1="21" x2="9" y2="9"/>
                                </svg>
                                推荐练习场景
                            </h3>
                            <div id="practiceScenarios" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
                        </div>

                        <div class="card" style="grid-column: span 12;">
                            <h3>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="16" x2="12" y2="12"/>
                                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                                </svg>
                                关键要点
                            </h3>
                            <ul id="keyPoints" style="padding-left: 20px; color: var(--text-secondary);"></ul>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/evaluate/static/js/evaluate.js"></script>
</body>
</html>
