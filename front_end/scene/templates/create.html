<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建场景 - AI 智能训练系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 消息样式 */
        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-content {
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .ai-message .message-content {
            background: white;
            border: 2px solid #667eea;
            color: #333;
        }
        
        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }
        
        /* Markdown 样式 */
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            font-weight: 600;
            color: #667eea;
        }
        
        .message-content strong {
            font-weight: 600;
            color: #333;
        }
        
        /* 状态面板样式 */
        .status-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .status-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-icon {
            font-size: 1.2em;
        }
        
        .status-label {
            font-weight: 600;
            color: #666;
            min-width: 70px;
            font-size: 0.9em;
        }
        
        .status-value {
            flex: 1;
            color: #333;
            font-size: 0.9em;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: background 0.3s;
        }
        
        .status-item.completed .status-indicator {
            background: #4caf50;
        }
        
        .status-item.in-progress .status-indicator {
            background: #ff9800;
        }
        
        /* 底部操作栏 */
        .action-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .action-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .success-message {
            font-size: 1.1em;
            font-weight: 600;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
        }
        
                /* Toast 动画 */
        @keyframes slideDown {
            from {
                transform: translate(-50%, -100px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        
        @keyframes slideUp {
            from {
                transform: translate(-50%, 0);
                opacity: 1;
            }
            to {
                transform: translate(-50%, -100px);
                opacity: 0;
            }
        }
        
        /* 场景信息提示栏 */
        .scene-info-bar {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 15px;
        }
        
        .scene-info-bar.show {
            display: flex;
        }
        
        .scene-info-bar .back-link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }
        
        .scene-info-bar .back-link:hover {
            color: #764ba2;
        }
        
        .scene-info-bar .divider {
            width: 1px;
            height: 20px;
            background: rgba(102, 126, 234, 0.3);
        }
        
        .scene-info-bar .info-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .scene-info-bar .info-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .scene-info-bar .info-text {
            color: #666;
            font-size: 0.9em;
        }
        
        .scene-info-bar .info-scene-name {
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
                <header class="header">
            <h1>🚀 创建新场景</h1>
            <p class="subtitle">智能体创建 - 像和朋友聊天一样告诉我您的需求</p>
        </header>

        <!-- 场景信息提示栏（从行业选择页面跳转时显示） -->
        <div class="scene-info-bar" id="sceneInfoBar">
            <a href="/industry/" class="back-link">← 返回选择</a>
            <div class="divider"></div>
            <div class="info-content">
                <span class="info-tag" id="infoIndustry"></span>
                <span class="info-text">场景：</span>
                <span class="info-scene-name" id="infoSceneName"></span>
            </div>
        </div>

        <div class="main-content">
            <!-- 对话区域 -->
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <!-- 初始为空，等待 AI 回复 -->
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="user-input" 
                            placeholder="输入你的想法..."
                            autocomplete="off"
                        >
                        <button id="send-btn" class="btn btn-primary">发送</button>
                    </div>
                </div>
            </div>

    
        </div>

        <!-- 底部操作栏 -->
        <div class="action-bar" id="action-bar">
            <div class="action-content">
                <div class="action-buttons">
                    <button id="start-btn" class="btn btn-success">保存并开始对练</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 查看内容模态框 -->
    <div class="result-modal" id="content-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📄 生成的场景内容</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- 动态填充内容 -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="close-modal-btn">关闭</button>
                <button class="btn btn-success" id="confirm-start-btn">开始对练</button>
            </div>
        </div>
    </div>

    <script src="/scene/static/js/create.js"></script>
    <script>
        // 显示场景信息栏（如果有参数）
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const industry = urlParams.get('industry');
            const scene = urlParams.get('scene');
            
            if (industry || scene) {
                const infoBar = document.getElementById('sceneInfoBar');
                const infoIndustry = document.getElementById('infoIndustry');
                const infoSceneName = document.getElementById('infoSceneName');
                
                if (industry) {
                    infoIndustry.textContent = industry;
                }
                if (scene) {
                    infoSceneName.textContent = scene;
                } else {
                    infoSceneName.textContent = '自定义场景';
                }
                
                infoBar.classList.add('show');
            }
        })();
    </script>
</body>
</html>
