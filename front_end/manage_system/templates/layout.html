<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI教练后台管理系统{% endblock %}</title>
    <link rel="stylesheet" href="/manage_system/static/css/layout.css">
    <link rel="stylesheet" href="/manage_system/static/css/common.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">🎯 AI教练</h1>
                <p class="subtitle">后台管理系统</p>
            </div>
            
            <nav class="sidebar-nav">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="/manage_system/" class="nav-link">
                            <span class="nav-icon">📊</span>
                            <span class="nav-text">仪表盘</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="/manage_system/scenes" class="nav-link">
                            <span class="nav-icon">🎬</span>
                            <span class="nav-text">场景管理</span>
                        </a>
                        <ul class="nav-submenu">
                            <li><a href="/manage_system/scenes/preset">预设场景库</a></li>
                            <li><a href="/manage_system/scenes/custom">自定义场景</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a href="/manage_system/records" class="nav-link">
                            <span class="nav-icon">📝</span>
                            <span class="nav-text">训练记录</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/manage_system/users" class="nav-link">
                            <span class="nav-icon">👥</span>
                            <span class="nav-text">用户管理</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/manage_system/assessment" class="nav-link">
                            <span class="nav-icon">⚙️</span>
                            <span class="nav-text">评估配置</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/manage_system/analytics" class="nav-link">
                            <span class="nav-icon">📈</span>
                            <span class="nav-text">数据分析</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/manage_system/settings" class="nav-link">
                            <span class="nav-icon">🔧</span>
                            <span class="nav-text">系统设置</span>
                        </a>
                    </li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <div class="user-name">管理员</div>
                        <div class="user-role">超级管理员</div>
                    </div>
                </div>
                <a href="/logout" class="logout-btn">退出</a>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <div class="breadcrumb">
                    {% block breadcrumb %}
                    <span class="breadcrumb-item">首页</span>
                    {% endblock %}
                </div>
                <div class="top-bar-actions">
                    <button class="icon-btn" title="通知">
                        <span class="badge">3</span>
                        🔔
                    </button>
                    <button class="icon-btn" title="帮助">❓</button>
                </div>
            </header>
            
            <!-- 页面内容 -->
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <script src="/manage_system/static/js/common.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
