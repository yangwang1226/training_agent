{% extends "layout.html" %}

{% block title %}首页 - AI教练后台管理系统{% endblock %}

{% block breadcrumb %}
<span class="breadcrumb-item">首页</span>
{% endblock %}

{% block content %}
<iframe src="/manage_system/welcome-content" style="width: 100%; height: calc(100vh - 100px); border: none; border-radius: 8px; background: #fff;" title="首页"></iframe>
{% endblock %}

{% block extra_js %}
<script>
    // 页面加载时激活首页导航并移除padding
    document.addEventListener('DOMContentLoaded', function() {
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.classList.remove('active');
        });
        
        const homeNavItem = document.querySelector('.nav-link[href="/"]');
        if (homeNavItem) {
            homeNavItem.closest('.nav-item').classList.add('active');
        }
        
        // 移除content-wrapper的padding以填满iframe
        const contentWrapper = document.querySelector('.content-wrapper');
        if (contentWrapper) {
            contentWrapper.style.padding = '0';
        }
    });
</script>
{% endblock %}
