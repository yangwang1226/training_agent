{% extends "layout.html" %}

{% block title %}选择场景模板 - AI教练后台管理系统{% endblock %}

{% block breadcrumb %}
<span class="breadcrumb-item"><a href="/manage_system/">首页</a></span>
<span class="breadcrumb-separator">/</span>
<span class="breadcrumb-item"><a href="/manage_system/builder">构建器</a></span>
<span class="breadcrumb-separator">/</span>
<span class="breadcrumb-item active">选择模板</span>
{% endblock %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* /typeset Template Selector - Yoodli-inspired */
:root {
    --primary-purple: #6366f1;
    --ink-black: #1a1a1a;
    --ink-gray: #4a4a4a;
    --ink-light: #767676;
    --paper-white: #fefefe;
    --bg-subtle: #fafafa;
    --border-color: #e5e7eb;
    
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
}

.selector-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: var(--space-lg) var(--space-md);
}

/* Header section */
.selector-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 2px solid var(--ink-black);
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink-gray);
    text-decoration: none;
    font-family: var(--font-body);
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.2s ease;
}

.back-button:hover {
    color: var(--ink-black);
}

.back-button svg {
    width: 18px;
    height: 18px;
}

/* Search box */
.search-box {
    position: relative;
    width: 300px;
}

.search-input {
    width: 100%;
    padding: 0.625rem 2.5rem 0.625rem 1rem;
    border: 2px solid var(--border-color);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--ink-black);
    transition: all 0.2s ease;
}

.search-input:focus {
    outline: none;
    border-color: var(--primary-purple);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.search-input::placeholder {
    color: var(--ink-light);
}

.search-icon {
    position: absolute;
    right: 0.875rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-light);
    pointer-events: none;
}

.search-icon svg {
    width: 18px;
    height: 18px;
}

/* Tab navigation */
.tab-nav {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    scrollbar-width: none;
}

.tab-nav::-webkit-scrollbar {
    display: none;
}

.tab-item {
    padding: 0.75rem 1.25rem;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--ink-gray);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    letter-spacing: 0.02em;
}

.tab-item:hover {
    color: var(--ink-black);
}

.tab-item.active {
    color: var(--primary-purple);
    border-bottom-color: var(--primary-purple);
    font-weight: 600;
}

/* Template grid */
.template-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
    margin-bottom: 3rem;
}

/* Template card - Yoodli style */
.template-card {
    background: var(--paper-white);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.5rem;
    transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: relative;
}

.template-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--primary-purple);
    transform: scaleX(0);
    transition: transform 0.3s ease;
}

.template-card:hover {
    border-color: var(--primary-purple);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.12);
    transform: translateY(-4px);
}

.template-card:hover::before {
    transform: scaleX(1);
}

/* Card header */
.card-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
}

.card-icon {
    font-size: 2rem;
    flex-shrink: 0;
}

.card-title-section {
    flex: 1;
}

.card-title {
    font-family: var(--font-display);
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--ink-black);
    margin-bottom: 0.25rem;
    line-height: 1.3;
}

.card-subtitle {
    font-family: var(--font-body);
    font-size: 0.8125rem;
    color: var(--ink-light);
    font-weight: 500;
}

/* Card body */
.card-description {
    font-family: var(--font-body);
    font-size: 0.875rem;
    line-height: 1.6;
    color: var(--ink-gray);
    flex: 1;
}

/* Card tags */
.card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.tag {
    display: inline-block;
    padding: 0.25rem 0.625rem;
    background: var(--bg-subtle);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 0.75rem;
    color: var(--ink-gray);
    font-weight: 500;
}

/* Card footer */
.card-footer {
    display: flex;
    gap: 0.75rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color);
}

.card-btn {
    flex: 1;
    padding: 0.625rem 1rem;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 600;
    text-align: center;
    border-radius: 6px;
    border: 2px solid var(--primary-purple);
    background: var(--paper-white);
    color: var(--primary-purple);
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-block;
}

.card-btn:hover {
    background: var(--primary-purple);
    color: var(--paper-white);
}

/* Empty state */
.empty-state {
    text-align: center;
    padding: 4rem 2rem;
}

.empty-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
    opacity: 0.5;
}

.empty-title {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink-black);
    margin-bottom: 0.5rem;
}

.empty-text {
    font-family: var(--font-body);
    font-size: 0.9375rem;
    color: var(--ink-gray);
}

/* Loading state */
.loading-state {
    text-align: center;
    padding: 3rem;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border-color);
    border-top-color: var(--primary-purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 768px) {
    .selector-header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
    }
    
    .search-box {
        width: 100%;
    }
    
    .template-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 1024px) {
    .template-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
}
</style>
{% endblock %}

{% block content %}
<div class="selector-container">
    <!-- Header -->
    <div class="selector-header">
        <a href="/manage_system/builder" class="back-button">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            返回构建器
        </a>
        
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索模板...">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </span>
        </div>
    </div>
    
    <!-- Tab Navigation -->
    <nav class="tab-nav">
        <button class="tab-item active" data-category="all">全部</button>
        <button class="tab-item" data-category="sales">销售</button>
        <button class="tab-item" data-category="learning">学习</button>
        <button class="tab-item" data-category="interview">面试</button>
        <button class="tab-item" data-category="other">其他</button>
        <button class="tab-item" data-category="organization">来自组织</button>
    </nav>

    <div class="template-grid" id="templateGrid">

    </div>

    <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">🔍</div>
        <h3 class="empty-title">未找到匹配的模板</h3>
        <p class="empty-text">尝试调整搜索条件或选择其他分类</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let allTemplates = [];
let currentCategory = 'all';
let searchQuery = '';

// Load templates on page load
document.addEventListener('DOMContentLoaded', function() {
    loadTemplates();
    setupEventListeners();
});

function setupEventListeners() {
    // Tab navigation
    document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', function() {
            // Update active state
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            
            // Update category and filter
            currentCategory = this.dataset.category;
            filterTemplates();
        });
    });
    
    // Search input
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', debounce(function() {
        searchQuery = this.value.trim().toLowerCase();
        filterTemplates();
    }, 300));
}

async function loadTemplates() {
    const loadingState = document.getElementById('loadingState');
    const templateGrid = document.getElementById('templateGrid');
    
    try {
        // Fetch preset scenes from API
        const response = await fetch('/manage_system/api/preset-scenes');
        const data = await response.json();
        
        if (data.success && data.data) {
            allTemplates = data.data;
            renderTemplates(allTemplates);
        } else {
            showEmptyState();
        }
    } catch (error) {
        console.error('Error loading templates:', error);
        showEmptyState();
    } finally {
        loadingState.style.display = 'none';
    }
}

function filterTemplates() {
    let filtered = allTemplates;
    
    // Filter by category
    if (currentCategory !== 'all') {
        filtered = filtered.filter(t => t.industry === currentCategory || t.category === currentCategory);
    }
    
    // Filter by search query
    if (searchQuery) {
        filtered = filtered.filter(t => 
            t.scene_name?.toLowerCase().includes(searchQuery) ||
            t.scene_prompt?.toLowerCase().includes(searchQuery) ||
            t.industry?.toLowerCase().includes(searchQuery)
        );
    }
    
    renderTemplates(filtered);
}

function renderTemplates(templates) {
    const templateGrid = document.getElementById('templateGrid');
    const emptyState = document.getElementById('emptyState');
    
    if (!templates || templates.length === 0) {
        templateGrid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    
    emptyState.style.display = 'none';
    
    const icons = {
        'sales': '💼',
        'learning': '📚',
        'interview': '🎯',
        'customer_service': '🎧',
        'other': '✨',
        'organization': '🏢'
    };
    
    templateGrid.innerHTML = templates.map(template => `
        <div class="template-card" data-scene-code="${template.scene_code}">
            <div class="card-header">
                <div class="card-icon">${icons[template.industry] || '🎯'}</div>
                <div class="card-title-section">
                    <h3 class="card-title">${escapeHtml(template.scene_name)}</h3>
                    <p class="card-subtitle">AI 角色：${escapeHtml(template.role_type || '通用教练')}</p>
                </div>
            </div>
            
            <p class="card-description">${escapeHtml(truncate(template.scene_prompt, 120))}</p>
            
            ${template.tags ? `
            <div class="card-tags">
                ${template.tags.split(',').map(tag => `<span class="tag">${escapeHtml(tag.trim())}</span>`).join('')}
            </div>
            ` : ''}
            
            <div class="card-footer">
                <a href="/manage_system/scenes/create-custom?template=${template.scene_code}" class="card-btn">自定义</a>
            </div>
        </div>
    `).join('');
}

function showEmptyState() {
    const templateGrid = document.getElementById('templateGrid');
    const emptyState = document.getElementById('emptyState');
    templateGrid.innerHTML = '';
    emptyState.style.display = 'block';
}

function escapeHtml(text) {
    if (!text) return '';
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.toString().replace(/[&<>"']/g, m => map[m]);
}

function truncate(str, length) {
    if (!str) return '';
    return str.length > length ? str.substring(0, length) + '...' : str;
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}
</script>
{% endblock %}
