{% block extra_css %}
<style>
/* Enhanced Colorful & Bolder Design */
:root {
    --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
}

.dashboard-page {
    padding: 0;
    margin: 0;
    min-height: 100vh;
}

/* COLORFUL & BOLD Hero Section */
.welcome-hero {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 200% 200%;
    animation: gradientShift 15s ease infinite;
    margin: -24px;
    position: relative;
    overflow: hidden;
}

/* Animated background gradient */
@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Decorative elements */
.welcome-hero::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    top: -250px;
    right: -250px;
    animation: float 20s ease-in-out infinite;
}

.welcome-hero::after {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    bottom: -150px;
    left: -150px;
    animation: float 15s ease-in-out infinite reverse;
}

@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(10deg); }
}

.welcome-content {
    text-align: center;
    padding: 3rem;
    position: relative;
    z-index: 1;
}

/* BOLDER: Ultra-large, ultra-bold text with text shadow */
.welcome-title {
    font-size: clamp(3.5rem, 10vw, 8rem);
    font-weight: 900;
    letter-spacing: -0.05em;
    color: #ffffff;
    margin: 0;
    line-height: 1;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                 0 5px 15px rgba(0, 0, 0, 0.2);
    animation: titleSlideIn 1s ease-out;
}

@keyframes titleSlideIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Colorful subtitle with backdrop */
.welcome-subtitle {
    font-size: 1.5rem;
    color: rgba(255, 255, 255, 0.95);
    font-weight: 500;
    margin-top: 2rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 1rem 2rem;
    border-radius: 50px;
    display: inline-block;
    animation: subtitleFadeIn 1s ease-out 0.3s both;
}

@keyframes subtitleFadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* COLORFUL & BOLD Quick Links */
.quick-links {
    margin-top: 4rem;
    display: flex;
    gap: 2rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: linksSlideUp 1s ease-out 0.6s both;
}

@keyframes linksSlideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.quick-link {
    position: relative;
    color: #ffffff;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 1.2rem 2.5rem;
    border-radius: 50px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.quick-link::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.2);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
}

.quick-link:hover::before {
    transform: translateX(0);
}

.quick-link:nth-child(1) {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
}

.quick-link:nth-child(2) {
    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
}

.quick-link:nth-child(3) {
    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
}

.quick-link:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
}

.quick-link span {
    position: relative;
    z-index: 1;
}

/* Stats Section */
.stats-section {
    background: #ffffff;
    padding: 4rem 2rem;
    margin: 0 -24px -24px;
}

.stats-container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2rem;
}

.stat-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 2rem;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    transition: height 0.4s ease;
}

.stat-card:nth-child(1)::before {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.stat-card:nth-child(2)::before {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
}

.stat-card:nth-child(3)::before {
    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
}

.stat-card:nth-child(4)::before {
    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
}

.stat-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
}

.stat-card:hover::before {
    height: 100%;
    opacity: 0.1;
}

.stat-number {
    font-size: 3.5rem;
    font-weight: 900;
    color: #000000;
    margin: 0;
    line-height: 1;
}

.stat-label {
    font-size: 1rem;
    color: #666666;
    margin-top: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.stat-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.8;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
// Counter animation for stats
document.addEventListener('DOMContentLoaded', function() {
    const observerOptions = {
        threshold: 0.5
    };
    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                animateValue(entry.target);
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);
    
    document.querySelectorAll('.stat-number').forEach(el => {
        observer.observe(el);
    });
});

function animateValue(element) {
    const text = element.textContent;
    const isPercentage = text.includes('%');
    const isDecimal = text.includes('.');
    const hasK = text.includes('K');
    
    let endValue = parseFloat(text.replace(/[^0-9.]/g, ''));
    if (hasK) endValue *= 1000;
    
    const duration = 2000;
    const startTime = performance.now();
    
    function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const currentValue = progress * endValue;
        let displayValue = Math.floor(currentValue);
        
        if (isDecimal) {
            displayValue = currentValue.toFixed(1);
        } else if (hasK && currentValue >= 1000) {
            displayValue = (currentValue / 1000).toFixed(1) + 'K';
        }
        
        element.textContent = displayValue + (isPercentage ? '%' : '');
        
        if (progress < 1) {
            requestAnimationFrame(update);
        } else {
            element.textContent = text;
        }
    }
    
    requestAnimationFrame(update);
}
</script>
