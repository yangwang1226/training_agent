{% extends "layout.html" %}

{% block title %}场景构建器 - AI教练后台管理系统{% endblock %}

{% block breadcrumb %}
<span class="breadcrumb-item"><a href="/manage_system/">首页</a></span>
<span class="breadcrumb-separator">/</span>
<span class="breadcrumb-item active">场景构建器</span>
{% endblock %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* /typeset + Yoodli-inspired Scene Builder */
:root {
    /* Yoodli-inspired Color Palette */
    --primary-purple: #6366f1;
    --primary-purple-dark: #4f46e5;
    --secondary-cyan: #06b6d4;
    --secondary-orange: #f97316;
    --accent-pink: #ec4899;
    
    /* Typeset colors */
    --ink-black: #1a1a1a;
    --ink-gray: #4a4a4a;
    --ink-light: #767676;
    --paper-white: #fefefe;
    --bg-subtle: #fafafa;
    
    /* Typography */
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    
    /* Spacing */
    --space-xs: 0.5rem;
    --space-sm: 1rem;
    --space-md: 1.5rem;
    --space-lg: 2rem;
    --space-xl: 3rem;
    --space-2xl: 4rem;
}

.builder-container {
    max-width: 900px;
    margin: 0 auto;
    padding: var(--space-2xl) var(--space-md);
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Back button */
.back-button {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink-gray);
    text-decoration: none;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: var(--space-xl);
    transition: color 0.3s ease;
}

.back-button:hover {
    color: var(--ink-black);
}

.back-button svg {
    width: 20px;
    height: 20px;
}

/* Main heading */
.builder-heading {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    color: var(--primary-purple);
    text-align: center;
    margin-bottom: var(--space-xl);
    line-height: 1.2;
}

/* Main input area */
.input-section {
    background: var(--paper-white);
    border: 2px solid #e0e7ff;
    border-radius: 16px;
    padding: var(--space-lg);
    margin-bottom: var(--space-xl);
    transition: all 0.3s ease;
}

.input-section:focus-within {
    border-color: var(--primary-purple);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
}

.input-label {
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--ink-gray);
    margin-bottom: var(--space-sm);
    display: block;
}

.main-textarea {
    width: 100%;
    min-height: 200px;
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.6;
    color: var(--ink-black);
    border: none;
    outline: none;
    resize: vertical;
    background: transparent;
}

.main-textarea::placeholder {
    color: var(--ink-light);
}

/* Action buttons in textarea */
.textarea-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: var(--space-md);
    padding-top: var(--space-md);
    border-top: 1px solid #e5e7eb;
}

.action-left {
    display: flex;
    gap: var(--space-sm);
}

.icon-btn {
    background: transparent;
    border: none;
    color: var(--ink-light);
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 8px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-btn:hover {
    background: var(--bg-subtle);
    color: var(--primary-purple);
}

.icon-btn svg {
    width: 20px;
    height: 20px;
}

.ai-create-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: var(--paper-white);
    color: var(--primary-purple);
    border: 2px solid var(--primary-purple);
    padding: 0.625rem 1.25rem;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
    box-shadow: none;
    position: relative;
    overflow: hidden;
}

/* Editorial ink-fill effect */
.ai-create-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--primary-purple);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    z-index: 0;
}

.ai-create-btn:hover::before {
    transform: scaleX(1);
}

.ai-create-btn:hover {
    color: var(--paper-white);
    border-color: var(--primary-purple);
}

.ai-create-btn span,
.ai-create-btn svg {
    position: relative;
    z-index: 1;
}

.ai-create-btn svg {
    width: 16px;
    height: 16px;
    transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.ai-create-btn:hover svg {
    transform: rotate(12deg) scale(1.1);
}

/* Divider section - Reduced spacing */
.divider-section {
    text-align: center;
    margin: var(--space-xl) 0 var(--space-lg) 0;
    position: relative;
}

.view-all-templates-btn {
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--ink-gray);
    background: var(--paper-white);
    padding: 0.5rem 1.25rem;
    border: 1px solid #e5e7eb;
    border-radius: 20px;
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.view-all-templates-btn:hover {
    color: var(--primary-purple);
    border-color: var(--primary-purple);
    background: rgba(99, 102, 241, 0.05);
    transform: translateY(2px);
}

.view-all-templates-btn svg {
    width: 16px;
    height: 16px;
    animation: bounce-down 2s infinite;
}

@keyframes bounce-down {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
}

.divider-section::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #e5e7eb;
    z-index: 0;
}

/* Template section */
.template-section-title {
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink-black);
    text-align: center;
    margin-bottom: var(--space-lg);
}

.template-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: var(--space-md);
    margin-bottom: var(--space-2xl);
}

/* Template card - Yoodli style */
.template-card {
    background: var(--paper-white);
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    padding: var(--space-lg);
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.template-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-purple), var(--secondary-cyan));
    transform: scaleX(0);
    transition: transform 0.3s ease;
}

.template-card:hover::before {
    transform: scaleX(1);
}

.template-card:hover {
    border-color: var(--primary-purple);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
    transform: translateY(-4px);
}

.template-card.purple::before {
    background: linear-gradient(90deg, #a855f7, #ec4899);
}

.template-card.cyan::before {
    background: linear-gradient(90deg, #06b6d4, #3b82f6);
}

.template-card.orange::before {
    background: linear-gradient(90deg, #f97316, #eab308);
}

.template-icon {
    font-size: 2.5rem;
    margin-bottom: var(--space-sm);
    filter: grayscale(0.3);
    transition: filter 0.3s ease;
}

.template-card:hover .template-icon {
    filter: grayscale(0);
}

.template-title {
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink-black);
    margin-bottom: var(--space-xs);
}

.template-description {
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--ink-light);
    line-height: 1.5;
}

/* View all templates link */
.view-all-link {
    text-align: center;
    margin-top: var(--space-md);
}

.view-all-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink-gray);
    text-decoration: none;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 500;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.view-all-btn:hover {
    background: #fafafa;
    color: var(--ink-black);
}

.view-all-btn svg {
    width: 16px;
    height: 16px;
    transition: transform 0.3s ease;
}

.view-all-btn:hover svg {
    transform: translateX(4px);
}

/* Bottom actions */
.bottom-actions {
    display: flex;
    justify-content: center;
    gap: var(--space-md);
    margin-top: var(--space-2xl);
    padding-top: var(--space-xl);
    border-top: 1px solid #e5e7eb;
}

.btn {
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 500;
    padding: 0.875rem 1.75rem;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-block;
}

.btn-primary {
    background: var(--ink-black);
    color: var(--paper-white);
    border-color: var(--ink-black);
}

.btn-primary:hover {
    background: var(--ink-gray);
    border-color: var(--ink-gray);
}

.btn-secondary {
    background: transparent;
    color: var(--ink-gray);
    border-color: #e5e7eb;
}

.btn-secondary:hover {
    background: #fafafa;
    border-color: var(--ink-light);
    color: var(--ink-black);
}

/* All Templates Section - Reduced spacing */
.all-templates-section {
    margin-top: var(--space-xl);
    padding-top: var(--space-lg);
    animation: fadeIn 0.6s ease-out;
    scroll-margin-top: 1rem;
}

/* Template tabs - Compact layout */
.template-tabs {
    display: flex;
    gap: 0.25rem;
    margin-bottom: var(--space-lg);
    border-bottom: 1px solid #e5e7eb;
    overflow-x: auto;
    scrollbar-width: thin;
}

.template-tabs::-webkit-scrollbar {
    height: 3px;
}

.template-tabs::-webkit-scrollbar-thumb {
    background: #e5e7eb;
    border-radius: 2px;
}

.template-tab {
    padding: 0.625rem 1rem;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--ink-gray);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
}

.template-tab:hover {
    color: var(--ink-black);
    background: rgba(99, 102, 241, 0.05);
}

.template-tab.active {
    color: var(--primary-purple);
    border-bottom-color: var(--primary-purple);
    font-weight: 600;
    background: rgba(99, 102, 241, 0.08);
}



/* Loading state */
.templates-loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem;
}

.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #e5e7eb;
    border-top-color: var(--primary-purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.templates-loading p {
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--ink-gray);
}

/* Full template card - /quieter + /distill style */
.full-template-card {
    background: var(--paper-white);
    border: 1px solid #e5e7eb;
    padding: 1.5rem;
    transition: all 0.3s ease;
    position: relative;
}

.full-template-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--primary-purple);
    transform: scaleY(0);
    transition: transform 0.3s ease;
}

.full-template-card:hover {
    border-color: var(--ink-light);
}

.full-template-card:hover::before {
    transform: scaleY(1);
}

/* Card icon - /quieter style: minimal, single color */
.full-card-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    border: 1px solid #e5e7eb;
    margin-bottom: 1rem;
    font-size: 1.25rem;
    opacity: 0.7;
}

/* Card content */
.full-card-title {
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink-black);
    margin-bottom: 0.5rem;
    line-height: 1.3;
}

.full-card-role {
    font-family: var(--font-body);
    font-size: 0.8125rem;
    color: var(--ink-light);
    margin-bottom: 0.75rem;
}

.full-card-description {
    font-family: var(--font-body);
    font-size: 0.875rem;
    line-height: 1.6;
    color: var(--ink-gray);
    margin-bottom: 1rem;
}

.card-meta {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.meta-item {
    font-family: var(--font-body);
    font-size: 0.75rem;
    color: var(--ink-light);
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
}

.card-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.card-industry-tag {
    font-family: var(--font-body);
    font-size: 0.75rem;
    color: var(--ink-light);
    padding: 0.25rem 0.5rem;
    background: #fafafa;
    border-radius: 4px;
}

.full-card-btn {
    width: 100%;
    padding: 0.625rem;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    font-weight: 500;
    text-align: center;
    border: 1px solid #e5e7eb;
    background: transparent;
    color: var(--ink-gray);
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: block;
}

.full-card-btn:hover {
    border-color: var(--ink-black);
    color: var(--ink-black);
    background: #fafafa;
}

/* Templates header with search - Compact */
.templates-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-md);
    gap: var(--space-md);
}

.templates-header-left {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
}

.templates-count {
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--ink-gray);
    font-weight: 500;
}

/* Search box - Compact */
.search-box {
    position: relative;
    width: 280px;
}

.search-input {
    width: 100%;
    padding: 0.5rem 2.25rem 0.5rem 0.875rem;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 0.8125rem;
    color: var(--ink-black);
    transition: all 0.2s ease;
    background: var(--bg-subtle);
}

.search-input:focus {
    outline: none;
    border-color: var(--primary-purple);
    background: var(--paper-white);
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.08);
}

.search-input::placeholder {
    color: var(--ink-light);
}

.search-icon {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-light);
    pointer-events: none;
}

.search-icon svg {
    width: 16px;
    height: 16px;
}

/* 3x4 Grid layout - 3列4行 - Compact spacing */
.templates-full-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
    margin-bottom: var(--space-lg);
}

/* Load more trigger */
.load-more-trigger {
    text-align: center;
    padding: 2rem;
}

.load-more-trigger .loading-spinner {
    width: 30px;
    height: 30px;
    margin: 0 auto 0.5rem;
}

.load-more-trigger p {
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--ink-gray);
}

/* Templates end message */
.templates-end {
    text-align: center;
    padding: 2rem;
    border-top: 1px solid #e5e7eb;
}

.templates-end p {
    font-family: var(--font-body);
    font-size: 0.875rem;
    color: var(--ink-gray);
}

/* Back to top button */
.back-to-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 48px;
    height: 48px;
    background: var(--primary-purple);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    transition: all 0.3s ease;
    z-index: 100;
}

.back-to-top:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}

.back-to-top svg {
    width: 24px;
    height: 24px;
}


/* Tablet */
@media (min-width: 769px) and (max-width: 1023px) {
    .templates-full-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
/* Responsive */
@media (max-width: 768px) {
    .builder-container {
        padding: var(--space-lg) var(--space-sm);
    }
    
    .template-grid {
        grid-template-columns: 1fr;
    }
    
    .templates-full-grid {
        grid-template-columns: 1fr;
    }
    
    .search-box {
        width: 100%;
    }
    
    .bottom-actions {
        flex-direction: column;
    }
    
    .btn {
        width: 100%;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="builder-container">
    <!-- Back button -->
    <!-- <a href="/manage_system/" class="back-button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        返回资源库
    </a> -->

    <!-- Main heading -->
    <h1 class="builder-heading">你的训练场景是关于什么的？</h1>

    <!-- Main input area -->
    <div class="input-section">
        <label class="input-label">场景描述</label>
        <textarea 
            class="main-textarea" 
            id="sceneDescription"
            placeholder="用几句话描述您的训练场景...\n\n例如：客户服务场景，处理客户投诉和退款请求。我需要练习如何以同理心倾听客户，提供解决方案，并确保客户满意度。"
        ></textarea>
        
        <div class="textarea-actions">
            <div class="action-left">
                <button class="icon-btn" title="添加附件">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </button>
                <button class="icon-btn" title="格式选项">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>
            
            <button class="ai-create-btn" id="aiCreateBtn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <span>使用AI创作</span>
            </button>
        </div>
    </div>

        <!-- Divider -->
    <div class="divider-section">
        <button class="view-all-templates-btn" id="scrollToTemplatesBtn">
            查看全部模板
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
            </svg>
        </button>
    </div>


    
        <!-- All Templates Section -->
    <div class="all-templates-section" id="allTemplatesSection">
        <!-- Header with search -->
        <div class="templates-header">
            <div class="templates-header-left">
                <span class="templates-count" id="templatesCount">加载中...</span>
            </div>
            <div class="search-box">

// Load draft on page load
window.addEventListener('DOMContentLoaded', function() {
    const draft = localStorage.getItem('sceneDraft');
    if (draft) {
        document.getElementById('sceneDescription').value = draft;
    }
});
// ============================================
// Lazy Loading Templates System
// ============================================

// State management
const templateState = {
    allTemplates: [],           // 所有模板数据
    filteredTemplates: [],      // 筛选后的模板
    displayedTemplates: [],     // 已显示的模板
    currentPage: 0,             // 当前页码
    pageSize: 12,               // 每页12个（4x3布局）
    currentCategory: 'all',     // 当前分类
    searchQuery: '',            // 搜索关键词
    isLoading: false,           // 是否正在加载
    hasMore: true,              // 是否还有更多
    templatesLoaded: false      // 是否已加载过数据
};

// ============================================
// 初始化
// ============================================
function initSceneBuilder() {
    try {
        setupSearch();
        setupTabs();
        setupIntersectionObserver();
        setupBackToTop();
        setupScrollToTemplates();
    } catch(e) { 
        console.error('Setup error:', e);
    }
    
    // 页面加载时直接获取并显示模板
    fetchAllTemplates();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSceneBuilder);
} else {
    initSceneBuilder();
}

// ============================================
// 获取所有模板数据
// ============================================
async function fetchAllTemplates() {
    if (templateState.isLoading) return;
    
    templateState.isLoading = true;
    const loadingEl = document.getElementById('templatesLoading');
    const grid = document.getElementById('templatesFullGrid');
    
    try {
        const response = await fetch('/manage_system/api/preset-scenes');
        const data = await response.json();
        
        console.log('✅ API 返回数据:', data);
        
        // 获取模板数组（兼容不同的返回格式）
        let templates = [];
        if (data.preset_scenes && Array.isArray(data.preset_scenes)) {
            templates = data.preset_scenes;
        } else if (data.data && Array.isArray(data.data)) {
            templates = data.data;
        } else if (Array.isArray(data)) {
            templates = data;
        }
        
        console.log(`📊 加载了 ${templates.length} 个模板`);
        
        if (templates.length > 0) {
            console.log('🔍 第一个模板示例:', templates[0]);
            
            // 保存数据
            templateState.allTemplates = templates;
            templateState.filteredTemplates = templates;
            templateState.templatesLoaded = true;
            
            // 更新模板数量显示
            updateTemplateCount(templates.length);
            
            // 隐藏加载动画
            if (loadingEl) loadingEl.style.display = 'none';
            
            // 直接渲染所有模板（暂不分页）
            renderTemplates(templates, false);
            
            // 显示结束消息
            const endMessage = document.getElementById('templatesEnd');
            const totalCount = document.getElementById('totalCount');
            if (endMessage) endMessage.style.display = 'block';
            if (totalCount) totalCount.textContent = templates.length;
        } else {
            console.error('❌ 没有找到模板数据');
            if (loadingEl) loadingEl.style.display = 'none';
            showError('暂无可用模板');
        }
    } catch (error) {
        console.error('❌ 加载失败:', error);
        if (loadingEl) loadingEl.style.display = 'none';
        showError('加载失败，请检查网络连接');
    } finally {
        templateState.isLoading = false;
    }
}

// ============================================
// 加载下一页
// ============================================
function loadNextPage() {
    if (templateState.isLoading || !templateState.hasMore) return;
    
    templateState.isLoading = true;
    const loadMoreTrigger = document.getElementById('loadMoreTrigger');
    if (loadMoreTrigger) loadMoreTrigger.style.display = 'block';
    
    // 模拟延迟，提供更好的用户体验
    setTimeout(() => {
        const start = templateState.currentPage * templateState.pageSize;
        const end = start + templateState.pageSize;
        const pageTemplates = templateState.filteredTemplates.slice(start, end);
        
        if (pageTemplates.length > 0) {
            renderTemplates(pageTemplates, true); // append = true
            templateState.displayedTemplates.push(...pageTemplates);
            templateState.currentPage++;
            
            // 检查是否还有更多
            templateState.hasMore = end < templateState.filteredTemplates.length;
        } else {
            templateState.hasMore = false;
        }
        
        // 更新UI状态
        updateLoadingState();
        templateState.isLoading = false;
    }, 300);
}

// ============================================
// 渲染模板
// ============================================
function renderTemplates(templates, append = false) {
    console.log('Rendering', templates.length, 'templates, append:', append);
    
    const grid = document.getElementById('templatesFullGrid');
    if (!grid) {
        console.error('Grid element not found!');
        return;
    }
    
    // 图标映射（根据 industry_code）
    const icons = {
        'automobile': '🚗',
        'retail': '🛒',
        'finance': '💰',
        'education': '📚',
        'healthcare': '🏥',
        'technology': '💻',
        'service': '🤝',
        'other': '●'
    };
    
    // 分类标签映射
    const industryLabels = {
        'automobile': '汽车',
        'retail': '零售',
        'finance': '金融',
        'education': '教育',
        'healthcare': '医疗',
        'technology': '科技',
        'service': '服务',
        'other': '其他'
    };
    
        const html = templates.map(template => {
        const industryTag = industryLabels[template.industry_code] || template.industry_code || '其他';
        const icon = icons[template.industry_code] || '●';
        const difficultyMap = {'easy': '简单', 'medium': '中等', 'hard': '困难'};
        const difficulty = difficultyMap[template.difficulty] || template.difficulty;
        
        return `
        <div class="full-template-card" data-template-id="${template.scene_code}">
            <div class="card-header-row">
                <div class="full-card-icon">${icon}</div>
                <span class="card-industry-tag">${industryTag}</span>
            </div>
            <h3 class="full-card-title">${escapeHtml(template.scene_name)}</h3>
            <p class="full-card-role">👤 ${escapeHtml(template.user_role || '通用训练')} vs 🤖 ${escapeHtml(template.ai_role || 'AI')}</p>
            <p class="full-card-description">${escapeHtml(truncateText(template.scene_description, 80))}</p>
            <div class="card-meta">
                <span class="meta-item">📊 ${difficulty}</span>
                <span class="meta-item">🔥 ${template.usage_count || 0} 次使用</span>
            </div>
            <a href="/manage_system/scene-config?scene_code=${template.scene_code}" class="full-card-btn">使用此模板</a>
        </div>
        `;
    }).join('');
    
    if (append) {
        grid.insertAdjacentHTML('beforeend', html);
    } else {
        grid.innerHTML = html;
    }
}

// ============================================
// 更新加载状态
// ============================================
function updateLoadingState() {
    const loadMoreTrigger = document.getElementById('loadMoreTrigger');
    const endMessage = document.getElementById('templatesEnd');
    const totalCount = document.getElementById('totalCount');
    
    if (loadMoreTrigger) loadMoreTrigger.style.display = 'none';
    
    if (!templateState.hasMore) {
        if (endMessage) {
            endMessage.style.display = 'block';
            if (totalCount) {
                totalCount.textContent = templateState.filteredTemplates.length;
            }
        }
    } else {
        if (endMessage) endMessage.style.display = 'none';
    }
}

// ============================================
// 设置搜索
// ============================================
function setupSearch() {
    // 暂时禁用搜索功能
    const searchInput = document.getElementById('templateSearch');
    if (searchInput) {
        searchInput.disabled = true;
        searchInput.placeholder = '搜索功能开发中...';
    }
}

// ============================================
// 设置Tab切换
// ============================================
function setupTabs() {
    // 暂时禁用标签切换功能
    document.querySelectorAll('.template-tab').forEach(tab => {
        if (tab.dataset.category !== 'all') {
            tab.style.opacity = '0.5';
            tab.style.cursor = 'not-allowed';
            tab.disabled = true;
        }
    });
}

// ============================================
// 过滤并重新加载
// ============================================
function filterAndReload() {
    // 重置状态
    templateState.currentPage = 0;
    templateState.displayedTemplates = [];
    templateState.hasMore = true;
    
    // 过滤模板
    let filtered = templateState.allTemplates;
    
    console.log('Filter - Total templates:', filtered.length);
    console.log('Filter - Current category:', templateState.currentCategory);
    
    // 按分类过滤
    if (templateState.currentCategory !== 'all') {
        filtered = filtered.filter(t => {
            const matches = t.scene_type === templateState.currentCategory;
            if (!matches) {
                console.log(`Filtered out: ${t.scene_name} (type: ${t.scene_type})`);
            }
            return matches;
        });
        console.log('After category filter:', filtered.length);
    }
    
        // 按搜索词过滤
    if (templateState.searchQuery) {
        filtered = filtered.filter(t =>
            (t.scene_name && t.scene_name.toLowerCase().includes(templateState.searchQuery)) ||
            (t.scene_description && t.scene_description.toLowerCase().includes(templateState.searchQuery)) ||
            (t.user_role && t.user_role.toLowerCase().includes(templateState.searchQuery)) ||
            (t.ai_role && t.ai_role.toLowerCase().includes(templateState.searchQuery))
        );
    }
    
    templateState.filteredTemplates = filtered;
    
    // 清空并重新加载
    const grid = document.getElementById('templatesFullGrid');
    if (grid) grid.innerHTML = '';
    
        // 更新数量显示
    updateTemplateCount(filtered.length);
    
    if (filtered.length === 0) {
        showEmptyState();
    } else {
        loadNextPage();
    }
}

// ============================================
// Intersection Observer（监听滚动加载更多）
// ============================================
function setupIntersectionObserver() {
    const loadMoreTrigger = document.getElementById('loadMoreTrigger');
    if (!loadMoreTrigger) return;
    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && templateState.hasMore && !templateState.isLoading) {
                loadNextPage();
            }
        });
    }, {
        root: null,
        rootMargin: '100px',
        threshold: 0.1
    });
    
    observer.observe(loadMoreTrigger);
}

// ============================================
// 返回顶部按钮
// ============================================
function setupBackToTop() {
    // 创建返回顶部按钮
    const backToTopBtn = document.createElement('button');
    backToTopBtn.className = 'back-to-top';
    backToTopBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
        </svg>
    `;
    document.body.appendChild(backToTopBtn);
    
    // 滚动监听
    window.addEventListener('scroll', debounce(() => {
        if (window.scrollY > window.innerHeight) {
            backToTopBtn.style.display = 'flex';
        } else {
            backToTopBtn.style.display = 'none';
        }
    }, 100));
    
    // 点击返回顶部
    backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
}

// ============================================
// 平滑滚动到模板区
// ============================================
function setupScrollToTemplates() {
    const btn = document.getElementById('scrollToTemplatesBtn');
    if (btn) {
        btn.addEventListener('click', function() {
            const templatesSection = document.getElementById('allTemplatesSection');
            if (templatesSection) {
                templatesSection.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }
        });
    }
}

// ============================================
// 工具函数
// ============================================
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function truncateText(str, length) {
    if (!str) return '';
    return str.length > length ? str.substring(0, length) + '...' : str;
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func.apply(this, args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

function showError(message) {
    const grid = document.getElementById('templatesFullGrid');
    if (grid) {
        grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                <p style="color: var(--ink-gray); font-size: 1rem; margin-bottom: 1rem;">😕 ${message}</p>
                <button onclick="location.reload()" style="padding: 0.75rem 1.5rem; background: var(--primary-purple); color: white; border: none; border-radius: 6px; cursor: pointer;">刷新页面</button>
            </div>
        `;
    }
}

function showEmptyState() {
    const grid = document.getElementById('templatesFullGrid');
    if (grid) {
        grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
                <h3 style="font-family: var(--font-display); font-size: 1.25rem; color: var(--ink-black); margin-bottom: 0.5rem;">未找到匹配的模板</h3>
                <p style="color: var(--ink-gray); font-size: 0.875rem;">尝试调整搜索条件或选择其他分类</p>
            </div>
        `;
    }
    
    const endMessage = document.getElementById('templatesEnd');
    if (endMessage) endMessage.style.display = 'none';
}

function updateTemplateCount(count) {
    const countEl = document.getElementById('templatesCount');
    if (countEl) {
        countEl.textContent = `共 ${count} 个模板`;
    }
}
</script>
