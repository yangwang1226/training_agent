<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试场景配置页面</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #6366f1;
            padding-bottom: 1rem;
        }
        .section {
            margin: 2rem 0;
            padding: 1rem;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .status.warning { background: #fef3c7; color: #92400e; }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.875rem;
        }
        button {
            background: #6366f1;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.5rem 0.5rem 0.5rem 0;
        }
        button:hover {
            background: #4f46e5;
        }
        .log {
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ddd;
            padding: 1rem;
            border-radius: 4px;
        }
        .log-entry {
            padding: 0.5rem;
            border-left: 3px solid #6366f1;
            margin-bottom: 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }
        .log-entry.error { border-left-color: #ef4444; background: #fee; }
        .log-entry.success { border-left-color: #10b981; background: #efe; }
        .log-entry.info { border-left-color: #3b82f6; background: #eff6ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 场景配置页面调试工具</h1>
        
        <div class="section">
            <h2>步骤 1: 测试API端点</h2>
            <label for="sceneCodeInput">场景代码:</label>
            <input type="text" id="sceneCodeInput" value="auto_first_visit" style="width: 300px; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 4px;">
            <br>
            <button onclick="testAPI()">测试 /api/preset-scene/config</button>
            <div id="apiResult"></div>
        </div>
        
        <div class="section">
            <h2>步骤 2: 检查DOM元素</h2>
            <button onclick="checkDOMElements()">检查必需的DOM元素</button>
            <div id="domResult"></div>
        </div>
        
        <div class="section">
            <h2>步骤 3: 模拟页面加载</h2>
            <button onclick="simulatePageLoad()">模拟加载场景配置</button>
            <div id="loadResult"></div>
        </div>
        
        <div class="section">
            <h2>步骤 4: 查看实际页面</h2>
            <button onclick="goToActualPage()">跳转到实际配置页面</button>
        </div>
        
        <div class="section">
            <h2>📋 调试日志</h2>
            <button onclick="clearLog()">清除日志</button>
            <div id="debugLog" class="log"></div>
        </div>
    </div>

    <script>
        const logs = [];
        
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ timestamp, message, type });
            
            const logDiv = document.getElementById('debugLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('debugLog').innerHTML = '';
            logs.length = 0;
            addLog('日志已清除', 'info');
        }
        
        async function testAPI() {
            const sceneCode = document.getElementById('sceneCodeInput').value.trim();
            const resultDiv = document.getElementById('apiResult');
            
            if (!sceneCode) {
                resultDiv.innerHTML = '<p style="color: red;">请输入场景代码</p>';
                addLog('错误: 场景代码为空', 'error');
                return;
            }
            
            addLog(`开始测试API: /api/preset-scene/config/${sceneCode}`, 'info');
            resultDiv.innerHTML = '<p>⏳ 加载中...</p>';
            
            try {
                const url = `/api/preset-scene/config/${sceneCode}`;
                addLog(`请求URL: ${url}`, 'info');
                
                const response = await fetch(url);
                addLog(`响应状态: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                const result = await response.json();
                addLog(`API返回成功: ${result.success}`, result.success ? 'success' : 'error');
                
                if (result.success) {
                    const data = result.data;
                    
                    let html = '<div style="margin-top: 1rem; padding: 1rem; background: #d1fae5; border-radius: 4px;">';
                    html += '<h3 style="color: #065f46;">✅ API测试成功</h3>';
                    html += '<ul style="margin: 1rem 0;">';
                    html += `<li><strong>场景名称:</strong> ${data.scene_name}</li>`;
                    html += `<li><strong>场景描述:</strong> ${data.scene_description}</li>`;
                    html += `<li><strong>AI角色:</strong> ${data.ai_role}</li>`;
                    html += `<li><strong>用户角色:</strong> ${data.user_role}</li>`;
                    html += `<li><strong>固定问题:</strong> ${Array.isArray(data.fixed_questions) ? data.fixed_questions.length : 0} 个</li>`;
                    html += `<li><strong>关联问题:</strong> ${Array.isArray(data.related_questions) ? data.related_questions.length : 0} 个</li>`;
                    html += `<li><strong>SOP质检项:</strong> ${Array.isArray(data.sop_checklist) ? data.sop_checklist.length : 0} 个</li>`;
                    html += '</ul>';
                    html += '<details><summary style="cursor: pointer; font-weight: 600;">查看完整响应</summary>';
                    html += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                    html += '</details>';
                    html += '</div>';
                    
                    resultDiv.innerHTML = html;
                    
                    addLog(`场景数据加载成功: ${data.scene_name}`, 'success');
                    addLog(`固定问题: ${data.fixed_questions ? data.fixed_questions.length : 0}项`, 'info');
                    addLog(`关联问题: ${data.related_questions ? data.related_questions.length : 0}项`, 'info');
                    addLog(`SOP质检项: ${data.sop_checklist ? data.sop_checklist.length : 0}项`, 'info');
                } else {
                    resultDiv.innerHTML = `<div style="margin-top: 1rem; padding: 1rem; background: #fee2e2; border-radius: 4px; color: #991b1b;"><strong>❌ API返回错误:</strong> ${result.error}</div>`;
                    addLog(`API错误: ${result.error}`, 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="margin-top: 1rem; padding: 1rem; background: #fee2e2; border-radius: 4px; color: #991b1b;"><strong>❌ 请求失败:</strong> ${error.message}</div>`;
                addLog(`请求异常: ${error.message}`, 'error');
                console.error('API测试失败:', error);
            }
        }
        
        function checkDOMElements() {
            const resultDiv = document.getElementById('domResult');
            addLog('开始检查DOM元素...', 'info');
            
            const requiredElements = [
                'sceneName', 'sceneDesc', 'pageTitle', 'aiRole', 'userRole',
                'difficulty', 'duration', 'openingInput', 'backgroundInput',
                'fixedQuestionList', 'relatedQuestionList', 'sopList',
                'fixedQuestionCount', 'relatedQuestionCount', 'sopChecklistCount'
            ];
            
            let html = '<div style="margin-top: 1rem;"><h4>元素检查结果:</h4><ul>';
            let missingCount = 0;
            
            requiredElements.forEach(id => {
                const element = document.getElementById(id);
                const exists = element !== null;
                const status = exists ? '<span class="status success">存在</span>' : '<span class="status error">缺失</span>';
                html += `<li><code>${id}</code> ${status}</li>`;
                
                if (!exists) {
                    missingCount++;
                    addLog(`元素缺失: ${id}`, 'error');
                } else {
                    addLog(`元素存在: ${id}`, 'success');
                }
            });
            
            html += '</ul>';
            
            if (missingCount === 0) {
                html += '<p style="color: #065f46; font-weight: 600;">✅ 所有必需元素都存在</p>';
                addLog('DOM元素检查通过', 'success');
            } else {
                html += `<p style="color: #991b1b; font-weight: 600;">❌ 缺少 ${missingCount} 个必需元素</p>`;
                addLog(`DOM元素检查失败: 缺少${missingCount}个元素`, 'error');
            }
            
            html += '</div>';
            resultDiv.innerHTML = html;
        }
        
        async function simulatePageLoad() {
            const sceneCode = document.getElementById('sceneCodeInput').value.trim();
            const resultDiv = document.getElementById('loadResult');
            
            addLog(`模拟加载场景: ${sceneCode}`, 'info');
            resultDiv.innerHTML = '<p>⏳ 模拟加载中...</p>';
            
            try {
                // 这里只是模拟，实际页面会在iframe或新窗口中
                const response = await fetch(`/api/preset-scene/config/${sceneCode}`);
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <div style="margin-top: 1rem; padding: 1rem; background: #d1fae5; border-radius: 4px;">
                            <h4 style="color: #065f46;">✅ 模拟加载成功</h4>
                            <p>场景 "${result.data.scene_name}" 可以正常加载</p>
                            <p>建议在实际页面中打开浏览器控制台（F12）查看详细日志</p>
                        </div>
                    `;
                    addLog('模拟加载成功', 'success');
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="margin-top: 1rem; padding: 1rem; background: #fee2e2; border-radius: 4px; color: #991b1b;"><strong>❌ 模拟加载失败:</strong> ${error.message}</div>`;
                addLog(`模拟加载失败: ${error.message}`, 'error');
            }
        }
        
        function goToActualPage() {
            const sceneCode = document.getElementById('sceneCodeInput').value.trim();
            if (!sceneCode) {
                alert('请输入场景代码');
                return;
            }
            
            addLog(`跳转到实际页面: scene_code=${sceneCode}`, 'info');
            window.location.href = `/manage_system/scene-config?scene_code=${sceneCode}`;
        }
        
        // 页面加载时自动记录
        window.addEventListener('DOMContentLoaded', function() {
            addLog('调试工具已加载', 'success');
        });
    </script>
</body>
</html>
